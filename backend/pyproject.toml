[project]
name = "nqu-backend"
version = "0.1.0"
description = "NQU backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.143.0",
  "uvicorn[standard]==0.54.0",
  "sqlalchemy==2.1.4",
  "asyncpg==0.32.0",
  "alembic==1.20.0",
  "pydantic==2.14.1",
  "pydantic-settings>=2.4.0,<3.0.0",
  "PyJWT==2.15.1",
  "passlib[bcrypt]>=1.7.4,<2.0.0",
  "python-dotenv==1.2.4",
  "httpx==0.28.1",
  "greenlet>=3.0.3,<4.0.0",
  "groq==1.7.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio>=1.0.0,<2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
